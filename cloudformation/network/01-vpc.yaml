AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a custom VPC with DNS support and an Internet Gateway attached.
  Exports identifiers for downstream subnet and routing stacks.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network configuration
        Parameters:
          - EnvironmentName
          - VpcCidr
    ParameterLabels:
      EnvironmentName:
        default: Environment name
      VpcCidr:
        default: VPC CIDR block

Parameters:
  EnvironmentName:
    Type: String
    Default: blankenv
    Description: Prefix used in resource Name tags
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    ConstraintDescription: Alphanumeric characters and hyphens only

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: IPv4 CIDR block for the VPC
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$'
    ConstraintDescription: Must be a valid IPv4 CIDR in /16–/28 range

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${EnvironmentName}-VpcId'

  VpcCidr:
    Description: VPC CIDR block
    Value: !Ref VpcCidr
    Export:
      Name: !Sub '${EnvironmentName}-VpcCidr'

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway
    Export:
      Name: !Sub '${EnvironmentName}-InternetGatewayId'

  EnvironmentName:
    Description: Environment name used for cross-stack exports
    Value: !Ref EnvironmentName
    Export:
      Name: !Sub '${AWS::StackName}-EnvironmentName'
